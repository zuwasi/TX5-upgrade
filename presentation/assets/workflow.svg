<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img"><rect width="1120" height="540" fill="#2d2d2d"/>
<text x="28" y="44" fill="#f5f5f5" font-family="sans-serif" font-size="26">Migration workflow: change one dimension at a time</text>
<rect x="30" y="110" width="320" height="108" fill="#3b3b3b"/>
<text x="48" y="151" fill="#4f9efb" font-family="sans-serif" font-size="24">1. Inspect TX5</text>
<text x="48" y="192" fill="#f5f5f5" font-family="sans-serif" font-size="20">ABI / symbols / config</text>
<rect x="390" y="110" width="320" height="108" fill="#3b3b3b"/>
<text x="408" y="151" fill="#4f9efb" font-family="sans-serif" font-size="24">2. Stage 1 run</text>
<text x="408" y="192" fill="#f5f5f5" font-family="sans-serif" font-size="20">TX5.6 on Cortex-M4</text>
<rect x="750" y="110" width="320" height="108" fill="#3b3b3b"/>
<text x="768" y="151" fill="#4f9efb" font-family="sans-serif" font-size="24">3. Stage 2 run</text>
<text x="768" y="192" fill="#f5f5f5" font-family="sans-serif" font-size="20">swap kernel: TX6 M4</text>
<rect x="750" y="310" width="320" height="108" fill="#3b3b3b"/>
<text x="768" y="351" fill="#4f9efb" font-family="sans-serif" font-size="24">4. Stage 3 build</text>
<text x="768" y="392" fill="#f5f5f5" font-family="sans-serif" font-size="20">swap core: TX6 M85</text>
<rect x="390" y="310" width="320" height="108" fill="#3b3b3b"/>
<text x="408" y="351" fill="#4f9efb" font-family="sans-serif" font-size="24">5. M55 run</text>
<text x="408" y="392" fill="#f5f5f5" font-family="sans-serif" font-size="20">Armv8.1-M supplement</text>
<rect x="30" y="310" width="320" height="108" fill="#3b3b3b"/>
<text x="48" y="351" fill="#4f9efb" font-family="sans-serif" font-size="24">6. Board sign-off</text>
<text x="48" y="392" fill="#f5f5f5" font-family="sans-serif" font-size="20">BSP / timing / FPU / IRQ</text>
<path d="M352,165 L382,165" stroke="#9cc8fd" stroke-width="2"/>
<text x="367" y="167" fill="#9cc8fd" font-family="sans-serif" font-size="24">&gt;</text>
<path d="M712,165 L742,165" stroke="#9cc8fd" stroke-width="2"/>
<text x="727" y="167" fill="#9cc8fd" font-family="sans-serif" font-size="24">&gt;</text>
<path d="M746,365 L720,365" stroke="#9cc8fd" stroke-width="2"/>
<text x="713" y="367" fill="#9cc8fd" font-family="sans-serif" font-size="24">&lt;</text>
<path d="M386,365 L360,365" stroke="#9cc8fd" stroke-width="2"/>
<text x="353" y="367" fill="#9cc8fd" font-family="sans-serif" font-size="24">&lt;</text>
<path d="M910,220 L910,303" stroke="#9cc8fd" stroke-width="2"/>
<text x="28" y="494" fill="#bdbdbd" font-family="sans-serif" font-size="19">Steps 1-5 are done (step 4 is compile/link only); step 6 needs the target M85 silicon.</text>
</svg>